<title>Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one narrow study column; tabs on top, one working surface below */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#18213a; --muted:#5b6478; --line:#d5dae4;
  --accent:#3046c8; --accent-soft:#e3e7fb; --good:#1d7a4a; --good-soft:#dcf1e5; --bad:#b3322b; --bad-soft:#f8e1df;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151f; --surface:#1a2030; --ink:#e7eaf2; --muted:#9aa3b8; --line:#2d3548;
  --accent:#8fa0ff; --accent-soft:#252d4f; --good:#5fd394; --good-soft:#173528; --bad:#ff8a80; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151f; --surface:#1a2030; --ink:#e7eaf2; --muted:#9aa3b8; --line:#2d3548;
  --accent:#8fa0ff; --accent-soft:#252d4f; --good:#5fd394; --good-soft:#173528; --bad:#ff8a80; --bad-soft:#3d1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.progress{display:flex;flex-direction:column;gap:6px}
.progress-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.dot.half{border-color:var(--accent);color:var(--accent)}
.dot.full{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;font:600 14px var(--ui);padding:10px 8px;border:0;border-radius:7px;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#11151f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#11151f}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:13px;color:var(--muted)}
select,input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=text]{width:100%;font-size:17px}
.btn{font:600 14px var(--ui);padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
/* Learn */
.learn-list{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:150px 1fr;gap:4px 16px}
.entry .name{font-family:var(--display);font-weight:700;font-size:19px;grid-row:span 3}
.field{font-family:var(--body);font-size:16px;min-width:0}
.field small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.covered{background:var(--line);color:transparent!important;border-radius:4px;cursor:pointer;user-select:none}
.covered *{color:transparent!important}
@media (max-width:520px){.entry{grid-template-columns:1fr}.entry .name{grid-row:auto}}
/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;min-height:280px}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.prompt{font-family:var(--body);font-size:22px;line-height:1.35;text-wrap:balance}
.prompt.name{font-family:var(--display);font-weight:700;font-size:34px}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.answer .big{font-family:var(--display);font-weight:700;font-size:28px}
.answer .def{font-family:var(--body);font-size:19px}
.extra{font-family:var(--body);font-size:15px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.actions .btn{flex:1;min-width:120px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:16px var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.name{font-family:var(--display);font-weight:600;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{font-weight:600}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.done{text-align:center;justify-content:center;align-items:center}
.done .big{font-family:var(--display);font-weight:700;font-size:30px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.crumbs{display:flex;gap:6px;font-size:13px;color:var(--muted);min-height:20px}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.page>header{margin-bottom:4px}
section.page{display:flex;flex-direction:column;gap:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:22px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile-name{font-family:var(--display);font-weight:700;font-size:24px}
.tile-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

  <!-- HOME / SUBJECT PAGES (filled by script) -->
  <section id="page-menu" class="page">
    <header><h1 id="menuTitle">Revision Hub</h1><p class="sub" id="menuSub">Pick a subject.</p></header>
    <div class="tiles" id="menuTiles"></div>
  </section>

  <!-- DECK (any topic) -->
  <div id="page-deck" class="page" hidden style="display:flex;flex-direction:column;gap:20px">
    <header><h1 id="deckTitle"></h1><p class="sub" id="deckSub"></p></header>

    <section class="progress" aria-label="Progress">
      <div class="progress-row"><span>Memorised (both directions)</span><span id="progText"></span></div>
      <div class="bar"><span id="progBar"></span></div>
      <div class="dots" id="dots"></div>
    </section>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true" data-view="learn">Learn</button>
      <button role="tab" id="tab-recall" aria-selected="false" data-view="recall">Recall</button>
      <button role="tab" id="tab-quiz" aria-selected="false" data-view="quiz">Quiz</button>
    </nav>

    <section id="view-learn" class="view">
      <div class="controls" style="margin-bottom:12px">
        <label for="cover">Cover up:</label>
        <select id="cover"></select>
        <span style="font-size:13px;color:var(--muted)">Say it, then tap a grey box to check.</span>
      </div>
      <div class="learn-list" id="learnList"></div>
    </section>

    <section id="view-recall" class="view" hidden>
      <div class="controls" style="margin-bottom:12px">
        <label for="recallDir">Show me:</label>
        <select id="recallDir"></select>
      </div>
      <div class="card" id="recallCard"></div>
    </section>

    <section id="view-quiz" class="view" hidden>
      <div class="controls" style="margin-bottom:12px">
        <label for="quizDir">Questions:</label>
        <select id="quizDir"></select>
      </div>
      <div class="card" id="quizCard"></div>
    </section>

    <div class="foot">
      <span>Got it twice in a row = memorised for that direction. Misses come back sooner.</span>
      <button class="linkbtn" id="reset">Reset progress</button>
    </div>
  </div>
</div>

<script>
/* ================= CONTENT ================= */
const POETIC = [
  {n:"Alliteration", d:"Repetition of sounds at the beginning of words.", e:"She Sells Sea Shells.", f:"Sound Effect- quicker rhythm."},
  {n:"Assonance", d:"Repetition of the same vowel sound", e:"Purple Curtain", f:"Sound Effect- Gives the reader the ability to hear the sentence and imagine the image."},
  {n:"Couplet", d:"Two lines of poetry paired together by rhyme", e:"Here and Year examples of rhyming in a poem.", f:"Gives the poem a rhythmic quality."},
  {n:"Metaphor", d:"Comparing two things, as if one actually is the other", e:"A four foot box, a foot for every year= Coffin.", f:"Helps the reader to connect with the item and imagine it."},
  {n:"Onomatopoeia", d:"When the sound of a word echoes or suggests its meaning", e:"Bang, Crash.", f:"Gives a sound effect to the poem, making it more interesting."},
  {n:"Hyperbole", d:"When a poet uses exaggeration to get their point across.", e:"I have been waiting here for years.", f:"To add humour or make the reader more interested."},
  {n:"Personification", d:"Objects are given human characteristics for effect", e:"The car roared.", f:"Adds more of a lifelike feel and creates an image."},
  {n:"Simile", d:"Comparing two things, using ‘like’ or ‘as’.", e:"As white as snow.", f:"Creates a vivid image."},
  {n:"Symbolism", d:"Use of one thing to represent another", e:"Light= A symbol of hope, happiness.", f:"Makes the reader think."}
];
const v = s => s.map(([n,d]) => ({n,d}));
const SEOMRA = v([
  ["Fuinneog","Window"],["Leabhar","Book"],["Ríomhaire","Computer"],["Radaitheoir","Radiator"],["Deasc","Desk"],
  ["Cóipleabhar","Copy book"],["Bosca bruscair","Bin"],["Clár bán","Whiteboard"],["Cathaoir","Chair"],["Seomra ranga","Classroom"],
  ["Doras","Door"],["Bosca lóin","Lunchbox"],["Scuab urláir","Sweeping brush"],["Ríomhaire glúine","Laptop"],["Dialann scoile","School journal"],
  ["Cófra stórála","Locker"],["Leabhragán","Bookcase"],["Peann luaidhe","Pencil"]
]);
const ABHAIR = v([
  ["Matamaitic","Maths"],["Eolaíocht","Science"],["Staidéar gnó","Business studies"],["Adhmadóireacht","Woodwork"],["Innealtóireacht","Engineering"],
  ["Léann clasaiceach","Classical studies"],["Creideamh","Religious education"],["Ceol","Music"],["Eacnamaíocht bhaile / Tíos","Home economics"],
  ["Grafaic","Graphics"],["Stair","History"],["Corpoideachas","Physical education"],["OSSP","CSPE"],["OSPS","SPHE"],
  ["Bitheolaíocht","Biology"],["Ceimic","Chemistry"],["Fisic","Physics"],["Gaeilge","Irish"],["Béarla","English"],
  ["Gearmáinis","German"],["Fraincis","French"],["Spáinnis","Spanish"],["Ábhar","Subject"]
]);

const POETIC_LABELS = {name:"Name", def:"Definition", nameWord:"name", defWord:"definition"};
const IRISH_LABELS = {name:"Irish", def:"English", nameWord:"Irish", defWord:"English"};
const DECKS = {
  "poetic-techniques": {title:"Poetic Techniques", parent:"english", items:POETIC, L:POETIC_LABELS, store:"ptd-progress-v1",
    sub:"Your term sheet, word for word. Learn it, then test both ways: definition → name and name → definition."},
  "seomra-ranga": {title:"An Seomra Ranga", parent:"irish", items:SEOMRA, L:IRISH_LABELS, store:"rh-seomra-ranga",
    sub:"The classroom. Test both ways: English → Irish and Irish → English."},
  "abhair": {title:"Ábhair", parent:"irish", items:ABHAIR, L:IRISH_LABELS, store:"rh-abhair",
    sub:"School subjects. Test both ways: English → Irish and Irish → English."}
};
const SUBJECTS = {
  english: {title:"English", decks:["poetic-techniques"]},
  irish: {title:"Irish", decks:["seomra-ranga","abhair"]}
};

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){ const m=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}} return m[b.length]; }
const opt = (v,t) => `<option value="${v}">${esc(t)}</option>`;

/* ================= PROGRESS (per deck) ================= */
function loadP(key){ try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { return {}; } }
let D = null, T = [], L = null, P = {};
const save = () => { try { localStorage.setItem(D.store, JSON.stringify(P)); } catch(e) {} };
const k = (i, dir) => i + ":" + (dir === "n2d" ? "n2d" : "d2n");
const streak = (i, dir) => (P[k(i,dir)] || 0);
function mark(i, dir, ok){ P[k(i,dir)] = ok ? streak(i,dir)+1 : 0; save(); renderProgress(); }
const known = (i, dir, p = P) => (p[k(i,dir)] || 0) >= 2;
const memorised = deck => { const p = loadP(deck.store); return deck.items.filter((_,i) => known(i,"d2n",p) && known(i,"n2d",p)).length; };
function renderProgress(){
  let full = 0;
  $("dots").innerHTML = T.map((t,i) => {
    const a = known(i,"d2n"), b = known(i,"n2d");
    if (a && b) full++;
    const cls = a && b ? "full" : (a || b ? "half" : "");
    return `<span class="dot ${cls}">${esc(t.n)}</span>`;
  }).join("");
  $("progText").textContent = `${full} / ${T.length}`;
  $("progBar").style.width = (full / T.length * 100) + "%";
}

/* ================= TABS ================= */
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-" + b.dataset.view);
}));

/* ================= LEARN ================= */
function renderLearn(){
  const c = $("cover").value, hasEx = !!T[0].e;
  const cov = w => (c === "name" && w === "n") || (c === "def" && w === "d") || (c === "all" && w !== "n");
  $("learnList").innerHTML = T.map(t => `
    <article class="entry">
      <div class="name ${cov("n")?"covered":""}">${esc(t.n)}</div>
      <div class="field ${cov("d")?"covered":""}"><small>${L.def}</small>${esc(t.d)}</div>
      ${hasEx ? `<div class="field ${cov("e")?"covered":""}"><small>Example</small>${esc(t.e)}</div>
      <div class="field ${cov("f")?"covered":""}"><small>Effect</small>${esc(t.f)}</div>` : ""}
    </article>`).join("");
}
$("cover").addEventListener("change", renderLearn);
$("learnList").addEventListener("click", e => { const el = e.target.closest(".covered"); if (el) el.classList.remove("covered"); });

/* ================= QUEUE ================= */
function makeQueue(mode){
  const dirs = mode === "mixed" ? ["d2n","n2d"] : [mode];
  const items = [];
  T.forEach((_,i) => dirs.forEach(d => items.push({i, d})));
  const s = it => streak(it.i, it.d === "n2d" ? "n2d" : "d2n");
  return shuffle(items).sort((a,b) => s(a) - s(b));
}
const reinsert = (q, it) => q.splice(Math.min(3, q.length), 0, it);

/* ================= RECALL ================= */
let rq = [], rCur = null;
function startRecall(){ rq = makeQueue($("recallDir").value); nextRecall(); }
function nextRecall(){
  rCur = rq.shift();
  const card = $("recallCard");
  if (!rCur){
    card.className = "card done";
    card.innerHTML = `<div class="big">Round done</div><p class="extra">Every card answered correctly once this round.</p><button class="btn primary" id="rAgain">Go again</button>`;
    $("rAgain").onclick = startRecall; return;
  }
  card.className = "card";
  const t = T[rCur.i], d = rCur.d;
  const label = {d2n:`${L.def} — say the ${L.nameWord}`, n2d:`${L.name} — say the ${L.defWord}`, e2n:`Example — say the ${L.nameWord}`}[d];
  const prompt = d === "n2d" ? `<div class="prompt name">${esc(t.n)}</div>` : `<div class="prompt">${esc(d === "e2n" ? t.e : t.d)}</div>`;
  card.innerHTML = `<div class="meta"><span>${label}</span><span>${rq.length + 1} left</span></div>
    ${prompt}
    <div class="actions"><button class="btn primary" id="rShow">Show answer</button></div>`;
  $("rShow").onclick = showRecall; $("rShow").focus({preventScroll:true});
}
function showRecall(){
  const t = T[rCur.i], d = rCur.d;
  const ex = t.e ? `<div class="extra">${d === "n2d" ? `e.g. ${esc(t.e)} · ${esc(t.f)}` : d === "e2n" ? esc(t.d) : "e.g. " + esc(t.e)}</div>` : "";
  const ans = d === "n2d" ? `<div class="def">${esc(t.d)}</div>${ex}` : `<div class="big">${esc(t.n)}</div>${ex}`;
  const acts = $("recallCard").querySelector(".actions");
  acts.insertAdjacentHTML("beforebegin", `<div class="answer">${ans}</div>`);
  acts.innerHTML = `<button class="btn bad" id="rMiss">Missed it</button><button class="btn good" id="rGot">Got it</button>`;
  $("rGot").onclick = () => { mark(rCur.i, rCur.d, true); nextRecall(); };
  $("rMiss").onclick = () => { mark(rCur.i, rCur.d, false); reinsert(rq, rCur); nextRecall(); };
  $("rGot").focus({preventScroll:true});
}
$("recallDir").addEventListener("change", startRecall);

/* ================= QUIZ ================= */
let qq = [], qCur = null, score = 0, asked = 0;
function startQuiz(){ qq = makeQueue($("quizDir").value); score = 0; asked = 0; nextQuiz(); }
function nextQuiz(){
  qCur = qq.shift();
  const card = $("quizCard");
  if (!qCur){
    card.className = "card done";
    card.innerHTML = `<div class="big">${score} / ${asked} first try</div><p class="extra">Missed questions were repeated until you got them.</p><button class="btn primary" id="qAgain">New quiz</button>`;
    $("qAgain").onclick = startQuiz; return;
  }
  card.className = "card";
  const t = T[qCur.i], d = qCur.d;
  const meta = `<div class="meta"><span>${d === "n2d" ? "Pick the " + L.defWord : d === "type" ? "Type the " + L.nameWord : "Pick the " + L.nameWord}</span><span>${qq.length + 1} left</span></div>`;
  if (d === "type"){
    card.innerHTML = `${meta}<div class="prompt">${esc(t.d)}</div>
      <form id="typeForm" class="options" autocomplete="off"><input type="text" id="typeIn" placeholder="${L.name}" aria-label="${L.name}" autocapitalize="off" spellcheck="false"><button class="btn primary">Check</button></form>
      <div id="qFb"></div>`;
    $("typeForm").onsubmit = ev => { ev.preventDefault(); checkTyped(); };
    $("typeIn").focus({preventScroll:true});
    return;
  }
  const wrong = shuffle(T.map((_,j)=>j).filter(j => j !== qCur.i)).slice(0,3);
  const opts = shuffle([qCur.i, ...wrong]);
  const isN = d === "n2d";
  card.innerHTML = `${meta}${isN ? `<div class="prompt name">${esc(t.n)}</div>` : `<div class="prompt">${esc(t.d)}</div>`}
    <div class="options">${opts.map(j => `<button class="opt ${isN ? "" : "name"}" data-j="${j}">${esc(isN ? T[j].d : T[j].n)}</button>`).join("")}</div>
    <div id="qFb"></div>`;
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.j, b));
}
function finish(ok, extraHtml){
  if (!qCur.retry) { asked++; if (ok) score++; }
  mark(qCur.i, qCur.d === "type" ? "d2n" : qCur.d, ok);
  if (!ok) { qCur.retry = true; reinsert(qq, qCur); }
  $("qFb").innerHTML = `<div class="answer"><div class="feedback ${ok?"ok":"no"}">${ok ? "Correct" : "Not quite — this one comes back."}</div>${extraHtml}
    <div class="actions"><button class="btn primary" id="qNext">Next</button></div></div>`;
  $("qNext").onclick = nextQuiz; $("qNext").focus({preventScroll:true});
}
function pick(j, btn){
  const ok = j === qCur.i;
  $("quizCard").querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.j === qCur.i) b.classList.add("right"); });
  if (!ok) btn.classList.add("wrong");
  const t = T[qCur.i];
  finish(ok, `<div class="extra"><strong>${esc(t.n)}</strong> = ${esc(t.d)}</div>`);
}
function checkTyped(){
  const t = T[qCur.i];
  const val = norm($("typeIn").value);
  if (!val) return;
  // accept any "/"-separated answer; accents and small typos don't count against you
  const ok = t.n.split("/").map(norm).some(a => lev(val, a) <= (a.length > 8 ? 3 : a.length > 4 ? 2 : 1));
  $("typeIn").disabled = true; $("typeForm").querySelector("button").disabled = true;
  finish(ok, `<div class="big">${esc(t.n)}</div>`);
}
$("quizDir").addEventListener("change", startQuiz);

$("reset").onclick = () => {
  const b = $("reset");
  if (b.dataset.confirm){ P = {}; save(); renderProgress(); b.textContent = "Reset progress"; delete b.dataset.confirm; startRecall(); startQuiz(); }
  else { b.dataset.confirm = 1; b.textContent = "Tap again to wipe progress"; setTimeout(() => { if (b.dataset.confirm){ delete b.dataset.confirm; b.textContent = "Reset progress"; } }, 3000); }
};

/* ================= OPEN A DECK ================= */
function openDeck(id){
  D = DECKS[id]; T = D.items; L = D.L; P = loadP(D.store);
  $("deckTitle").textContent = D.title; $("deckSub").textContent = D.sub;
  const hasEx = !!T[0].e;
  $("cover").innerHTML = opt("none","Nothing (read it)") + opt("name", L.name === "Name" ? "Names" : L.name) + opt("def", L.name === "Name" ? "Definitions" : L.def) + (hasEx ? opt("all","Everything but names") : "");
  $("recallDir").innerHTML = opt("mixed","Mixed (both ways)") + opt("d2n",`${L.def} → I say the ${L.nameWord}`) + opt("n2d",`${L.name} → I say the ${L.defWord}`) + (hasEx ? opt("e2n",`Example → I say the ${L.nameWord}`) : "");
  $("quizDir").innerHTML = opt("mixed","Mixed (both ways)") + opt("d2n",`${L.def} → pick the ${L.nameWord}`) + opt("n2d",`${L.name} → pick the ${L.defWord}`) + opt("type",`${L.def} → type the ${L.nameWord}`);
  document.querySelectorAll(".tabs button").forEach((x,i) => x.setAttribute("aria-selected", i === 0));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-learn");
  renderLearn(); renderProgress(); startRecall(); startQuiz();
}

/* ================= ROUTING ================= */
const tile = (href, name, meta) => `<a class="tile" href="${href}"><span class="tile-name">${esc(name)}</span><span class="tile-meta">${esc(meta)}</span></a>`;
const crumb = parts => parts.map(([n,h]) => h ? `<a href="${h}">${esc(n)}</a><span>/</span>` : `<span>${esc(n)}</span>`).join("");
function route(){
  const p = location.hash.slice(1);
  const deck = DECKS[p], subj = SUBJECTS[p];
  $("page-menu").hidden = !!deck; $("page-deck").hidden = !deck;
  if (deck){
    const s = SUBJECTS[deck.parent];
    $("crumbs").innerHTML = crumb([["Home","#"],[s.title,"#"+deck.parent],[deck.title]]);
    openDeck(p);
  } else if (subj){
    $("crumbs").innerHTML = crumb([["Home","#"],[subj.title]]);
    $("menuTitle").textContent = subj.title; $("menuSub").textContent = "What do you want to study?";
    $("menuTiles").innerHTML = subj.decks.map(id => { const d = DECKS[id]; return tile("#"+id, d.title, `${d.items.length} ${d.L.name === "Name" ? "terms" : "words"} · ${memorised(d)} memorised`); }).join("");
  } else {
    $("crumbs").innerHTML = "";
    $("menuTitle").textContent = "Revision Hub"; $("menuSub").textContent = "Pick a subject.";
    $("menuTiles").innerHTML = Object.entries(SUBJECTS).map(([id,s]) => tile("#"+id, s.title, `${s.decks.length} topic${s.decks.length === 1 ? "" : "s"}`)).join("");
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
